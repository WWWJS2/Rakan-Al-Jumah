<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5d34f">
<title>Rakan Al Jomah — Digital Business Card</title>
<style>
  :root{
    --navy:#1a314f;
    --yellow:#f5d34f;
    --green:#62c96f;
    --card-ratio:255.118/141.732;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#f3f1eb;color:var(--navy);font-family:Arial,Helvetica,sans-serif}
  body{display:grid;place-items:center;padding:clamp(16px,4vw,44px);overflow-x:hidden}

  .scene{
    width:min(94vw,980px);
    perspective:1800px;
    display:grid;
    place-items:center;
  }

  .card-shell{
    position:relative;
    width:100%;
    aspect-ratio:var(--card-ratio);
    border-radius:clamp(12px,2.1vw,24px);
    box-shadow:
      0 34px 70px rgba(20,38,63,.18),
      0 10px 28px rgba(20,38,63,.11);
    isolation:isolate;
    animation:cardArrive 980ms cubic-bezier(.2,.88,.22,1) both;
  }

  .card-shell::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    pointer-events:none;
    z-index:30;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.32);
  }

  .face{
    position:absolute;
    inset:0;
    border-radius:inherit;
    overflow:hidden;
    background:#fff;
    transform-style:preserve-3d;
    backface-visibility:hidden;
    will-change:transform,opacity;
  }

  .face img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  .front{z-index:3;opacity:1;transform:none}
  .back{z-index:2;opacity:0;transform:rotateY(88deg) scale(.985)}

  .card-shell.show-back .front{z-index:2;opacity:0;transform:rotateY(-88deg) scale(.985)}
  .card-shell.show-back .back{z-index:3;opacity:1;transform:none}

  .card-shell.animating .front,
  .card-shell.animating .back{
    transition:
      transform 760ms cubic-bezier(.18,.82,.2,1),
      opacity 410ms ease;
  }

  @keyframes cardArrive{
    0%{opacity:0;transform:translateY(42px) scale(.96)}
    70%{opacity:1;transform:translateY(-3px) scale(1.006)}
    100%{opacity:1;transform:none}
  }

  /* premium edge glow, independent from the artwork */
  .edge-light{
    position:absolute;
    inset:-2px;
    border-radius:inherit;
    z-index:25;
    pointer-events:none;
    opacity:.72;
    background:linear-gradient(115deg,
      transparent 0%,transparent 36%,
      rgba(255,255,255,.05) 43%,
      rgba(255,255,255,.88) 49%,
      rgba(255,255,255,.08) 56%,
      transparent 64%,transparent 100%);
    background-size:240% 100%;
    animation:edgeSweep 4.7s cubic-bezier(.28,.68,.2,1) infinite;
    mix-blend-mode:screen;
  }

  @keyframes edgeSweep{
    0%,40%{background-position:180% 0;opacity:0}
    48%{opacity:.78}
    72%{background-position:-80% 0;opacity:.55}
    100%{background-position:-80% 0;opacity:0}
  }

  /* exact clickable zones over the original vector artwork */
  .contact-link{
    position:absolute;
    left:4.6%;
    width:33.5%;
    height:8.8%;
    z-index:15;
    border-radius:999px;
    text-decoration:none;
    outline:none;
    background:rgba(255,255,255,0);
    transition:background .18s ease,box-shadow .18s ease,transform .18s ease;
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
    display:block;
    pointer-events:auto;
    touch-action:manipulation;
  }
  .contact-link.phone{top:66.0%}
  .contact-link.email{top:74.6%}
  .contact-link.website{top:83.2%}

  .contact-link::after{
    content:"↗";
    position:absolute;
    right:6%;
    top:50%;
    transform:translateY(-50%) translateX(-5px);
    opacity:0;
    font-size:clamp(10px,1.7vw,18px);
    font-weight:800;
    color:var(--navy);
    transition:opacity .18s ease,transform .18s ease;
  }

  @media (hover:hover) and (pointer:fine){
    .contact-link:hover{
      background:rgba(255,255,255,.18);
      box-shadow:0 5px 18px rgba(26,49,79,.09), inset 0 0 0 1px rgba(255,255,255,.2);
      transform:translateX(2px);
    }
    .contact-link:hover::after{opacity:.75;transform:translateY(-50%) translateX(0)}
  }
  .contact-link:active{background:rgba(255,255,255,.26);transform:scale(.988)}
  .contact-link:focus-visible{box-shadow:0 0 0 3px rgba(26,49,79,.36),0 0 0 6px rgba(255,255,255,.8)}


  .flip-control{
    position:absolute;
    right:clamp(8px,1.4vw,15px);
    bottom:clamp(8px,1.4vw,15px);
    z-index:40;
    width:clamp(34px,5vw,46px);
    aspect-ratio:1;
    border:1px solid rgba(26,49,79,.17);
    border-radius:50%;
    background:rgba(255,255,255,.82);
    color:var(--navy);
    display:grid;
    place-items:center;
    box-shadow:0 7px 18px rgba(26,49,79,.12);
    backdrop-filter:blur(8px);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .flip-control svg{width:52%;height:auto}
  .flip-control:active{transform:scale(.94)}
  .flip-control:focus-visible{outline:3px solid rgba(26,49,79,.3);outline-offset:3px}

  @media (max-width:560px){
    body{padding:16px 10px}
    .card-shell{border-radius:14px}
    .contact-link{left:4%;width:39%}
    .contact-link::after{display:none}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>

<script>
(() => {
  const shell = document.getElementById('cardShell');
  const flip = document.getElementById('flipControl');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let showingBack = new URLSearchParams(location.search).get('side') === 'back';
  let timer = null;

  if (showingBack) shell.classList.add('show-back');

  function setSide(back){
    showingBack = back;
    shell.classList.add('animating');
    shell.classList.toggle('show-back', showingBack);
    window.setTimeout(() => shell.classList.remove('animating'), 820);
  }

  flip.addEventListener('click', () => {
    if (timer) { clearTimeout(timer); timer = null; }
    setSide(!showingBack);
  });

  if (!reduced && !showingBack) {
    timer = window.setTimeout(() => {
      setSide(true);
      timer = null;
    }, 1350);
  }

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  document.querySelectorAll('.contact-link[data-mobile-href]').forEach(link => {
    link.addEventListener('click', event => {
      if (timer) { clearTimeout(timer); timer = null; }
      if (isMobile) {
        event.preventDefault();
        window.location.href = link.dataset.mobileHref;
      }
    });
  });
})();
</script>
